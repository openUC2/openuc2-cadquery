name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: uc2cad --help && uc2cad lens-cartridge --help
      # every part family builds (the lens insert once shipped as a blank plate behind an `if 0:`)
      - run: python build_uc2v4.py --no-verify
      - run: python build_mirror_holder.py --no-verify
      - run: python check_lens_cartridge.py
      # OPM plates: rod rule vs the released plates, layouts, refusals
      # (the PRT-1051/1052 STEP comparison runs when extracted/plates/ is committed)
      - run: uc2cad plates --help && python check_opm_plates.py
