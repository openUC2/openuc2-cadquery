[project]
name = "openuc2-cadquery"
version = "0.1.0"
description = "Parametric CadQuery models of the openUC2 V4 inserts, and the printable lens cartridge that holds an optic at an arbitrary pose inside a cube"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cadquery>=2.4",
]

[project.optional-dependencies]
# The layout diagram generate() draws beside the STEP/STL output.
plot = ["matplotlib>=3.7"]
# Mesh-domain verification against the Inventor ground-truth exports
# (build_uc2v4.py --verify).
verify = ["trimesh>=4", "rtree>=1", "scipy>=1.10", "numpy>=1.24"]

[project.scripts]
uc2cad = "uc2v4.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uc2v4"]
